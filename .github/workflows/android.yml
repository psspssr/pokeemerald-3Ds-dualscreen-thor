name: Android

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'NOTICE.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact reviewed commit for release validation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Reusable validation has a run-specific namespace. It cannot cancel its
  # release caller, another release, or normal push/PR validation.
  group: android-validation-${{ inputs.source_ref || github.ref }}-${{ inputs.source_ref && github.run_id || github.workflow }}
  cancel-in-progress: ${{ !inputs.source_ref }}

jobs:
  source-and-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Verify the imported upstream pin
        run: python3 tools/check_origin.py --fetch
      - name: Updater and coverage regressions
        run: python3 -m unittest discover -s tools/tests -v
      - name: SDK declarations
        run: python3 tools/check_shim_coverage.py --headers-only
      - name: System shim with address and undefined-behavior sanitizers
        run: python3 android/shim/test/run_host_tests.py
      - name: Gameplay configuration and confirmation lifecycle
        run: python3 android/host/test/run_host_tests.py
      - name: FPS defaults and persistent option
        run: python3 android/native/test/run_fps_settings_tests.py
      - name: Expanded bottom-menu touch coordinates
        run: python3 android/native/test/run_bottom_menu_tests.py
      - name: Texture and shader regressions
        run: python3 android/gpu/test/test_gpu.py

  arm-game-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi libpng-dev python3-pil
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build the real ARM game and debug APK
        run: python3 tools/bootstrap.py --ndk "$ANDROID_HOME/ndk/27.2.12479018" --make --apk -j2
      - name: Native SDK symbol coverage
        run: python3 tools/check_shim_coverage.py --ndk "$ANDROID_HOME/ndk/27.2.12479018"
      - name: Original Pokemon encryption, RNG and optional gameplay rules
        run: python3 android/native/test/run_qol_tests.py
      - name: Mystery event eligibility, gifts and repeat protection
        run: python3 android/native/test/run_mystery_tests.py
      - name: Summary assets and move-selection regressions
        run: python3 android/native/test/run_summary_tests.py
      - name: Save message bounds and complete confirmation layout
        run: python3 android/native/test/run_save_ui_tests.py
      - name: Starter selection geometry and window bounds
        run: python3 android/native/test/run_starter_tests.py
      - name: Bag grid to vertical menu touch transitions
        run: python3 android/native/test/run_menu_state_tests.py
      - name: Shop assets and viewport
        run: python3 android/native/test/run_shop_tests.py
      - name: Contest graphics and Pokeblock viewport
        run: python3 android/native/test/run_contest_graphics_tests.py
      - name: Berry and Pokeblock feeding geometry
        run: python3 android/native/test/run_item_menu_geometry_tests.py
      - name: External graphics offsets and direct asset reads
        run: python3 android/native/test/run_asset_offset_tests.py
      - name: Condition palettes and map banner bounds
        run: python3 android/native/test/run_menu_asset_tests.py
      - name: Mirage Tower buffers and Spinda markings
        run: python3 android/native/test/run_fossil_spinda_tests.py
      - name: Drought and Battle Factory graphics
        run: python3 android/native/test/run_weather_factory_tests.py
      - name: Bottom-screen naming keyboard
        run: python3 android/native/test/run_naming_tests.py
      - name: Unsupported transfer exit path
        run: python3 android/native/test/run_unsupported_entry_tests.py
      - name: Sound-worker handoff and shutdown
        run: python3 android/native/test/run_audio_worker_tests.py
      - name: Asset-worker cancellation and shutdown
        run: python3 android/native/test/run_asset_worker_tests.py
      - name: Evolution sparkle coordinates and animation callbacks
        run: python3 android/native/test/run_evolution_tests.py
      - name: Build engine-only release APK
        run: python3 tools/bootstrap.py --ndk "$ANDROID_HOME/ndk/27.2.12479018" --make --apk --release --out build/android-release-out -j2
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-diagnostics
          retention-days: 14
          path: |
            build/upstream/3ds_port/build/link.log
            build/upstream/3ds_port/build/link_image.log
            build/upstream/3ds_port/build/undefined.txt
      # APKs and generated game data are deliberately not published by CI.

  app-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Make room for emulator userdata on the hosted runner
        run: |
          # Android and this C/Kotlin project do not use the runner's .NET SDKs.
          # Never remove software from a self-hosted machine.
          if [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ]; then
            sudo rm -rf /usr/share/dotnet
          fi
          df -h "$RUNNER_TEMP"
      - name: Install emulator and harness toolchain
        # Keep API 34 and real GLES/SurfaceView rendering, without the Google
        # apps whose first-boot jobs exhausted the hosted runner. ATD images
        # disable hardware drawing and are unsuitable for these pixel tests.
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'system-images;android-34;default;x86_64'
      - name: Pin the locally validated Android emulator
        run: |
          # Emulator 36 links the PulseAudio client even when -no-audio is used.
          sudo apt-get update
          sudo apt-get install -y libpulse0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/emerald-emulator.zip" https://dl.google.com/android/repository/emulator-linux_x64-15507667.zip
          echo "1eade4cf2df6ea8eeead4902c635897ba12aaa32aac4389eaae0fdb498a5b830  $RUNNER_TEMP/emerald-emulator.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/emerald-emulator.zip" -d "$RUNNER_TEMP/emerald-emulator"
          echo "EMERALD_EMULATOR=$RUNNER_TEMP/emerald-emulator/emulator/emulator" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/emerald-emulator/emulator/emulator" -version
      - name: Build harness APKs and lint before starting the emulator
        working-directory: android/app
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            assembleHarness assembleHarnessAndroidTest lintHarness
      - name: Start emulator
        timeout-minutes: 7
        run: |
          sudo chmod a+rw /dev/kvm
          # Recent command-line tools and emulator builds use different default
          # AVD directories. Give both processes the same explicit location.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/thor-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name thor-ci --path "$ANDROID_AVD_HOME/thor-ci.avd" --package 'system-images;android-34;default;x86_64' --device pixel_2
          test -f "$ANDROID_AVD_HOME/thor-ci.ini"
          python3 - "$ANDROID_AVD_HOME/thor-ci.avd/config.ini" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          fields = {}
          for line in path.read_text().splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  fields[key.strip()] = value.strip()
          fields.update({'hw.lcd.width': '720', 'hw.lcd.height': '1280',
                         'hw.lcd.density': '320', 'hw.initialOrientation': 'portrait'})
          path.write_text(''.join(f'{key}={value}\n' for key, value in fields.items()))
          PY
          "$EMERALD_EMULATOR" -accel-check
          "$EMERALD_EMULATOR" -list-avds
          cp "$ANDROID_HOME/system-images/android-34/default/x86_64/source.properties" emulator-image.properties
          # A smaller primary phone panel reduces software-composition load.
          # The test's separate Thor bottom display remains exactly 1240x1080.
          "$EMERALD_EMULATOR" -avd thor-ci -port 5554 -accel on -cores 2 -memory 2048 -skin 720x1280 -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu swiftshader > emulator.log 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 300))
          while ((SECONDS < deadline)); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat emulator.log
              exit 1
            fi
            booted="$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = 1 ]; then
              # AOSP CTS also preconfirms this tutorial: its SystemUI window
              # otherwise intercepts the test's injected control touches.
              timeout 10 adb shell settings put secure immersive_mode_confirmations confirmed
              timeout 10 adb shell input keyevent 224
              timeout 10 adb shell wm dismiss-keyguard
              timeout 10 adb shell input keyevent 3
              timeout 10 adb shell settings put global window_animation_scale 0
              timeout 10 adb shell settings put global transition_animation_scale 0
              timeout 10 adb shell settings put global animator_duration_scale 0
              break
            fi
            sleep 2
          done
          if [ "$booted" != 1 ]; then
            cat emulator.log
            exit 1
          fi
          # boot_completed precedes some first-boot UI work. Require a stable,
          # focused launcher and reject an OS ANR before starting our tests.
          healthy=0
          deadline=$((SECONDS + 90))
          while ((SECONDS < deadline)); do
            timeout 10 adb shell dumpsys window displays > emulator-startup-window.txt
            if grep -q 'Application Not Responding' emulator-startup-window.txt; then
              cat emulator-startup-window.txt
              exit 1
            fi
            if grep -Eqi 'mCurrentFocus=.*launcher' emulator-startup-window.txt; then
              healthy=$((healthy + 1))
              if ((healthy == 3)); then
                timeout 15 adb logcat -d -s ActivityManager:E > emulator-startup.log
                if grep -q 'ANR in ' emulator-startup.log; then
                  cat emulator-startup.log
                  exit 1
                fi
                adb shell wm size
                adb shell wm density
                exit 0
              fi
            else
              healthy=0
            fi
            sleep 2
          done
          cat emulator-startup-window.txt
          exit 1
      - name: App input, storage and secondary-display instrumentation
        working-directory: android/app
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process connectedHarnessAndroidTest
      - name: GLES pixel conformance
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash android/gpu/test/run-emulator.sh
      - name: Capture emulator log
        if: always()
        run: timeout 30 adb logcat -d > logcat.txt || true
      - name: Stop emulator
        if: always()
        run: timeout 15 adb emu kill || true
      - name: Keep emulator test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-emulator-reports
          retention-days: 14
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            emulator.log
            emulator-image.properties
            emulator-startup.log
            emulator-startup-window.txt
            logcat.txt
            build/gpu-tests/result.log
