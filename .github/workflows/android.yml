name: Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'NOTICE.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the imported upstream pin
        run: python3 tools/check_origin.py --fetch
      - name: Updater and coverage regressions
        run: python3 -m unittest discover -s tools/tests -v
      - name: SDK declarations
        run: python3 tools/check_shim_coverage.py --headers-only
      - name: System shim with address and undefined-behavior sanitizers
        run: python3 android/shim/test/run_host_tests.py
      - name: Texture and shader regressions
        run: python3 android/gpu/test/test_gpu.py

  arm-game-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi libpng-dev python3-pil
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build the real ARM game and debug APK
        run: python3 tools/bootstrap.py --ndk "$ANDROID_HOME/ndk/27.2.12479018" --make --apk -j2
      - name: Native SDK symbol coverage
        run: python3 tools/check_shim_coverage.py
      - name: Build engine-only release APK
        run: python3 tools/bootstrap.py --ndk "$ANDROID_HOME/ndk/27.2.12479018" --make --apk --release --out build/android-release-out -j2
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-diagnostics
          retention-days: 14
          path: |
            build/upstream/3ds_port/build/link.log
            build/upstream/3ds_port/build/link_image.log
            build/upstream/3ds_port/build/undefined.txt
      # APKs and generated game data are deliberately not published by CI.

  app-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Make room for emulator userdata on the hosted runner
        run: |
          # Android and this C/Kotlin project do not use the runner's .NET SDKs.
          # Never remove software from a self-hosted machine.
          if [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ]; then
            sudo rm -rf /usr/share/dotnet
          fi
          df -h "$RUNNER_TEMP"
      - name: Install emulator and harness toolchain
        # Match the locally verified dual-display/GLES harness while compiling
        # and targeting API 35. Current emulators enforce a 6 GB userdata floor.
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'emulator' 'system-images;android-34;google_apis;x86_64'
      - name: Start emulator
        timeout-minutes: 7
        run: |
          sudo chmod a+rw /dev/kvm
          # Recent command-line tools and emulator builds use different default
          # AVD directories. Give both processes the same explicit location.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/thor-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name thor-ci --path "$ANDROID_AVD_HOME/thor-ci.avd" --package 'system-images;android-34;google_apis;x86_64' --device pixel_2
          test -f "$ANDROID_AVD_HOME/thor-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd thor-ci -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu swiftshader_indirect > emulator.log 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 300))
          while ((SECONDS < deadline)); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat emulator.log
              exit 1
            fi
            booted="$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = 1 ]; then
              timeout 10 adb shell input keyevent 82
              timeout 10 adb shell settings put global window_animation_scale 0
              timeout 10 adb shell settings put global transition_animation_scale 0
              timeout 10 adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          cat emulator.log
          exit 1
      - name: App input, storage and secondary-display instrumentation
        working-directory: android/app
        run: ./gradlew --no-daemon connectedHarnessAndroidTest lintHarness
      - name: GLES pixel conformance
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash android/gpu/test/run-emulator.sh
      - name: Capture emulator log
        if: always()
        run: timeout 30 adb logcat -d > logcat.txt || true
      - name: Stop emulator
        if: always()
        run: timeout 15 adb emu kill || true
      - name: Keep emulator test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-emulator-reports
          retention-days: 14
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            emulator.log
            logcat.txt
            build/gpu-tests/result.log
